name: API security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p reports
      - name: Functional and security regression tests
        run: python -m pytest -q --junitxml=reports/tests.xml
      - name: SAST - Bandit
        run: python -m bandit -r app.py -f json -o reports/bandit.json
      - name: SCA - pip-audit (dependency vulnerability analysis)
        run: python -m pip_audit --no-deps --disable-pip -r requirements-lock.txt -f json -o reports/pip-audit.json
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: hdu-secure-api
          path: '.'
          format: 'HTML'
          out: reports/dependency-check
          args: >
            --enableExperimental
            --failOnCVSS 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/
